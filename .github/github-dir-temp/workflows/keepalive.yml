name: Manter servidor acordado

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no servidor
        run: |
          URL="${{ vars.RENDER_URL }}"
          if [ -z "$URL" ]; then echo "RENDER_URL nao configurado"; exit 1; fi
          curl -fsS --max-time 20 "$URL/api/stats" > /dev/null && echo "OK" || echo "FALHOU"
